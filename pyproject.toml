[project]
name = "fintrack"
version = "0.2.0"
description = "Personal finance tracker"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141",
    "uvicorn>=0.52",
    "sqlalchemy[asyncio]>=2.0.52",
    "asyncpg>=0.31",
    "redis>=8.1",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "jinja2>=3.1.6",
    "pyjwt>=2.13",
    "bcrypt>=5.0",
    "anthropic>=0.84",
]

[dependency-groups]
dev = [
    "ruff>=0.14",
    "mypy>=1.18",
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "pre-commit>=4.0",
]
legacy = [
    "flask>=3.1.3",
    "flask-jwt-extended>=4.7.1",
    "matplotlib>=3.8",
    "rich>=13.7",
    "yfinance>=1.2",
]

[tool.uv]
package = false
default-groups = ["dev", "legacy"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["src", "web", "./app.py", "./main.py", "./settings.py"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.Header", "fastapi.Cookie", "fastapi.Form", "fastapi.File", "fastapi.Security"]

[tool.ruff.format]
exclude = ["*.md"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["app"]
strict = true
warn_unreachable = true
show_error_codes = true
